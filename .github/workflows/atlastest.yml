name: atlastest

# Prueft die Kacheltextur: PNG-Sequenzen in verschiedenen Formaten, jede Kachel wird verglichen (nur manuell)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atlastest:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
      VCPKG_FEATURE_FLAGS: manifests,binarycaching
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: vcpkg vorbereiten
        shell: pwsh
        run: ./tools/prepare-vcpkg.ps1   # fester vcpkg-Stand, Korrektur fuer dav1d, Bootstrap

      - name: vcpkg-Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-x64-windows-static-${{ hashFiles('vcpkg.json', 'tools/prepare-vcpkg.ps1') }}
          restore-keys: vcpkg-x64-windows-static-

      - name: MSVC-Umgebung
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: resvg-Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\deps\resvg
          key: resvg-0.49.0-x64-crtstatic-${{ hashFiles('tools/build-resvg.ps1') }}

      - name: resvg bauen (SVG)
        shell: pwsh
        run: ./tools/build-resvg.ps1 -Out deps/resvg

      - name: Bauen
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static
          cmake --build build --config Release

      - name: Python-Pakete
        shell: pwsh
        run: python -m pip install --quiet pypng numpy

      - name: Kacheltexturen pruefen
        shell: pwsh
        run: python tools/atlastest.py "$pwd\build\peek.exe" "$env:RUNNER_TEMP\atlastest"
