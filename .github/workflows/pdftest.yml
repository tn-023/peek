name: pdftest

# Prueft den Kontaktabzug: erzeugt Beispiel-PDFs und legt sie im Zweig "pdftest" ab (nur manuell)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdftest:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
      VCPKG_FEATURE_FLAGS: manifests,binarycaching
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: vcpkg vorbereiten
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          # vcpkg des Runners auf den festen Stand aus vcpkg.json (builtin-baseline) setzen
          $b = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch -q origin $b
          if ($LASTEXITCODE -ne 0) { throw "vcpkg-Stand $b nicht abrufbar" }
          git -C "$env:VCPKG_INSTALLATION_ROOT" -c advice.detachedHead=false checkout -q -f $b
          if ($LASTEXITCODE -ne 0) { throw "vcpkg-Stand $b nicht auscheckbar" }
          & "$env:VCPKG_INSTALLATION_ROOT\bootstrap-vcpkg.bat" -disableMetrics | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "vcpkg-Bootstrap fehlgeschlagen" }

      - name: vcpkg-Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-x64-windows-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-x64-windows-static-

      - name: MSVC-Umgebung
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: resvg-Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\deps\resvg
          key: resvg-0.49.0-x64-crtstatic-${{ hashFiles('tools/build-resvg.ps1') }}

      - name: resvg bauen (SVG)
        shell: pwsh
        run: ./tools/build-resvg.ps1 -Out deps/resvg

      - name: Bauen
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static
          cmake --build build --config Release

      - name: Beispielbilder erzeugen
        shell: powershell
        run: ./tools/make-demo.ps1 -Root "$env:USERPROFILE\Pictures\peek-Demo"

      - name: PDFs erzeugen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pdftest | Out-Null
          $imgs = Get-ChildItem -Recurse "$env:USERPROFILE\Pictures\peek-Demo" -Include *.jpg,*.png | Select-Object -First 23 | ForEach-Object { $_.FullName }
          $p = Start-Process -FilePath build\peek.exe -ArgumentList (@('--kontaktabzug-test', "$pwd\pdftest\hoch.pdf", '0', '4', '5') + ($imgs | ForEach-Object { "`"$_`"" })) -Wait -PassThru
          Write-Host "Hochformat: $($p.ExitCode)"
          $p = Start-Process -FilePath build\peek.exe -ArgumentList (@('--kontaktabzug-test', "$pwd\pdftest\quer.pdf", '1', '3', '2') + ($imgs | Select-Object -First 7 | ForEach-Object { "`"$_`"" })) -Wait -PassThru
          Write-Host "Querformat: $($p.ExitCode)"
          Get-ChildItem pdftest

      - name: Im Zweig "pdftest" ablegen
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pdftest
          git rm -rf --cached . | Out-Null
          Get-ChildItem -Force | Where-Object { $_.Name -notin @('.git', 'pdftest') } | Remove-Item -Recurse -Force
          git add pdftest/*.pdf
          git commit -m "Kontaktabzug-Test von $env:GITHUB_SHA"
          git push -f origin pdftest
