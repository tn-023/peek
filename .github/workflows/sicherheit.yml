name: sicherheit

# Woechentliche Pruefung der Fremdbibliotheken auf bekannte Luecken (NVD, OSV/RustSec).
# Der Bericht steht in der Zusammenfassung des Laufs. Bei Handlungsbedarf schlaegt der Lauf fehl
# (GitHub meldet das per E-Mail); ein Issue wird nur angelegt, wenn Issues eingeschaltet sind.

on:
  schedule:
    - cron: '17 5 * * 1'   # montags 05:17 UTC
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'vcpkg.json', 'tools/build-resvg.ps1', 'tools/security-check.py', 'tools/security-ignore.txt' ]

permissions:
  contents: read
  issues: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bibliotheken pruefen
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python3 tools/security-check.py

      - name: Bericht sichern
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sicherheitsbericht
          retention-days: 30
          path: sicherheitsbericht.md

      - name: Zusammenfassung
        if: always()
        run: |
          if [ -f sicherheitsbericht.md ]; then cat sicherheitsbericht.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Issue bei Handlungsbedarf
        if: hashFiles('befund.txt') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" -q .has_issues)" != "true" ]; then
            echo "Issues sind ausgeschaltet, kein Issue angelegt."
            exit 0
          fi
          title="Sicherheitsprüfung: bekannte Lücke in einer Bibliothek"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body-file sicherheitsbericht.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file sicherheitsbericht.md
          fi

      - name: Handlungsbedarf melden
        if: hashFiles('befund.txt') != ''
        run: |
          echo "::error::Bekannte Lücke in einer Bibliothek gefunden, Details in der Zusammenfassung."
          exit 1
